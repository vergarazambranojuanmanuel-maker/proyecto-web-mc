<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto – EcoPortoviejo</title>
  <meta name="description" content="Formulario de contacto de EcoPortoviejo para dudas y sugerencias.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido principal</a>
  <header class="cabecera">
    <img src="img/logo.svg" alt="" width="48" height="48">
    <p class="titulo">EcoPortoviejo</p>
    <nav aria-label="Principal">
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="guia.html">Guía de reciclaje</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main id="contenido" class="contenido">
    <h1>Contacto</h1>
    <p>Escríbenos tus dudas o sugerencias. Los campos marcados con * son obligatorios.</p>
    <div id="resumen" class="resumen" role="alert" tabindex="-1" hidden></div>
    <form id="form-contacto" action="contacto.html" method="get">
      <div class="campo">
        <label for="nombre">Nombre completo *</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required aria-describedby="e-nombre">
        <p class="error" id="e-nombre"></p>
      </div>
      <div class="campo">
        <label for="correo">Correo electrónico *</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required aria-describedby="e-correo">
        <p class="error" id="e-correo"></p>
      </div>
      <div class="campo">
        <label for="mensaje">Mensaje *</label>
        <textarea id="mensaje" name="mensaje" rows="5" required aria-describedby="e-mensaje"></textarea>
        <p class="error" id="e-mensaje"></p>
      </div>
      <button type="submit" class="boton">Enviar mensaje</button>
    </form>
    <p id="exito" class="exito" role="status" hidden></p>
  </main>
  <footer class="pie">
    <p>© 2026 EcoPortoviejo. Proyecto académico.</p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
